name: Update Gtranslate hosts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-fcm-hosts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate hosts
        run: |
          python scripts/generate_gtranslate_hosts.py \
            --output dist/hosts.txt \
            --json-output dist/result.json \
            --max-ips-per-domain 1 \
            --probe-provider globalping \
            --globalping-location China
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtranslate-hosts
          path: dist/

      - name: Commit generated hosts
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "chore: update fcm hosts"
          file_pattern: dist/hosts.txt dist/result.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
