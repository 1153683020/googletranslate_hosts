name: Update IP List (daily)

# 触发方式：每天一次 + 手动触发
on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00，每天一次
  workflow_dispatch:      # 只要点一下按钮即可立即运行

jobs:
  download_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 需要 push 权限
    steps:
      # 1️⃣ 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ 安装 Python 依赖（如果根目录有 requirements.txt） 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 3️⃣ 让脚本可执行（可选，只是让 `./scripts/update_ips.py` 更直观）
      #- name: Make script executable
        #run: chmod +x scripts/update_ips.py

      # 4️⃣ 运行 Python 脚本
      - name: Run IP update script
        id: ip_update
        run: ./scripts/update_ips.py
        env:
          # 通过 secret 传入真实的 URL（推荐），否则使用脚本里的默认值
          DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}

      # 5️⃣ 当脚本返回非 0（即文件真的变更）时，进行提交
      - name: Configure Git user
        if: failure()                # 只在脚本返回非 0 时进入
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: failure()
        run: |
          git add custom_ips.txt custom_ips_summary.md
          git commit -m "🤖 Update IP list $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:${{ github.ref_name }}
