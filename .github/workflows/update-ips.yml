name: Update IP List (daily)

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00
  workflow_dispatch:      # 手动触发按钮

jobs:
  update_ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # 需要 push 权限
    env:
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 安装 Python ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      # ---------- 直接用 python 运行 ----------
      - name: Run IP update script
        id: run_update
        run: python scripts/update_ips.py
        env:
          # 把真实的下载地址放在 repo → Settings → Secrets → DOWNLOAD_URL
          DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}

      # ---------- 有变动时提交 ----------
      - name: Configure Git user
        if: failure()                # 脚本返回非 0（即有变更）时才走这里
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: failure()   # 只在有改动时执行
        run: |
          git add custom_ips.txt
          git commit -m "🤖 Update custom_ips.txt (auto) $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:${{ github.ref_name }}

